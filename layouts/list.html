<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">

{{ partial "head.html" . }}

<body>

  <div id="all">

    <header>

      {{ partial "nav.html" . }}

    </header>

    {{ partial "breadcrumbs.html" . }}

    <div id='Lastmod'>

      {{ .Lastmod | time.Format "2006年1月2日 更新" }}

    </div>

    <div id="content">
      {{ if isset .Params "id" }}

      {{ partial .Params.id . }}

      {{ else }}

      <div class="container">

        <div class="row">

          <div class="col-lg-12">

            <div>
              {{ .Content }}
            </div>

          </div>

        </div>
        <!-- /.row -->

      </div>
      <!-- /.container -->

      {{ end }}
    </div>
    <!-- /#content -->

    {{ partial "footer.html" . }}

  </div>
  <!-- /#all -->

  {{ partial "scripts.html" . }}

</body>

</html>
